<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient Matching --pub-bg-card & --pub-bg-main -->
    <linearGradient id="sentinelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030714" />
      <stop offset="40%" stop-color="#0A122C" />
      <stop offset="80%" stop-color="#060E22" />
      <stop offset="100%" stop-color="#02050E" />
    </linearGradient>

    <!-- Glowing Cyan Accent Radial -->
    <radialGradient id="cyberGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#2563EB" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#0A122C" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030714" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Metallic Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle HUD Grid Pattern -->
    <pattern id="hudGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="rgba(56, 189, 248, 0.25)" />
    </pattern>

    <!-- Scanline Texture Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000" stroke-width="1.2" stroke-opacity="0.35" />
      <line x1="0" y1="2" x2="100" y2="2" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="800" height="450" fill="url(#sentinelBg)" />
  <rect width="800" height="450" fill="url(#hudGrid)" />

  <!-- 2. Cyber Ambient Radial Glow -->
  <circle cx="400" cy="195" r="210" fill="url(#cyberGlow)" />

  <!-- 3. Concentric Target & Radar Rings -->
  <circle cx="400" cy="195" r="150" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="400" cy="195" r="115" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />
  <circle cx="400" cy="195" r="80" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" stroke-dasharray="16 4" />

  <!-- 4. Corner Framing Brackets (Exact Theme Matching) -->
  <path d="M 30 65 L 30 30 L 65 30" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <path d="M 770 65 L 770 30 L 735 30" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <path d="M 30 385 L 30 420 L 65 420" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <path d="M 770 385 L 770 420 L 735 420" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />

  <!-- 5. Crosshair Guides & Sub-Calibrations -->
  <line x1="400" y1="45" x2="400" y2="120" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.75" />
  <line x1="400" y1="270" x2="400" y2="345" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.75" />
  <line x1="220" y1="195" x2="315" y2="195" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.75" />
  <line x1="485" y1="195" x2="580" y2="195" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Crosshair Degree Calibrations -->
  <line x1="394" y1="80" x2="406" y2="80" stroke="#38BDF8" stroke-width="1.2" />
  <line x1="394" y1="105" x2="406" y2="105" stroke="#38BDF8" stroke-width="1.2" />
  <line x1="394" y1="285" x2="406" y2="285" stroke="#38BDF8" stroke-width="1.2" />
  <line x1="394" y1="310" x2="406" y2="310" stroke="#38BDF8" stroke-width="1.2" />
  <line x1="250" y1="189" x2="250" y2="201" stroke="#38BDF8" stroke-width="1.2" />
  <line x1="285" y1="189" x2="285" y2="201" stroke="#38BDF8" stroke-width="1.2" />
  <line x1="515" y1="189" x2="515" y2="201" stroke="#38BDF8" stroke-width="1.2" />
  <line x1="550" y1="189" x2="550" y2="201" stroke="#38BDF8" stroke-width="1.2" />

  <!-- 6. Central Gujarat Police Sentinel Crest & Sentry Lens Core -->
  <g transform="translate(400, 195)">
    <!-- Security Shield Background -->
    <path d="M 0 -62 Q 52 -62 52 -18 Q 52 42 0 68 Q -52 42 -52 -18 Q -52 -62 0 -62 Z" 
          fill="url(#shieldGrad)" stroke="#38BDF8" stroke-width="2.5" filter="url(#neonGlow)" />
    
    <!-- Inner Shield Inset -->
    <path d="M 0 -54 Q 44 -54 44 -16 Q 44 36 0 58 Q -44 36 -44 -16 Q -44 -54 0 -54 Z" 
          fill="#060E22" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

    <!-- Optical Lens Bezel -->
    <circle cx="0" cy="0" r="34" fill="#0A122C" stroke="#38BDF8" stroke-width="2" />
    <circle cx="0" cy="0" r="28" fill="#030714" stroke="#2563EB" stroke-width="1.5" />

    <!-- Aperture Blades -->
    <path d="M 0 -22 L 16 -12 L 14 8 L 0 20 L -14 8 L -16 -12 Z" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="12" fill="#0A1633" stroke="#38BDF8" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#38BDF8" filter="url(#neonGlow)" />

    <!-- Top Police Star / Emblem Hint -->
    <polygon points="0,-48 3,-38 12,-38 5,-32 8,-22 0,-28 -8,-22 -5,-32 -12,-38 -3,-38" fill="url(#goldGrad)" />
  </g>

  <!-- 7. Top Header Telemetry HUD Bar -->
  <!-- Left Header Badge: Sentinel Surveillance Node -->
  <g transform="translate(80, 26)">
    <rect width="215" height="30" rx="8" fill="#0A122C" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
    <!-- Police Badge Icon -->
    <circle cx="16" cy="15" r="8" fill="#1E3A8A" stroke="#38BDF8" stroke-width="1" />
    <polygon points="16,10 18,14 22,14 19,16 20,20 16,18 12,20 13,16 10,14 14,14" fill="#FEF08A" />
    <text x="32" y="19" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">GUJARAT POLICE</text>
    <text x="135" y="19" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38BDF8">// SENTINEL</text>
  </g>

  <!-- Right Header Badge: Live Sentry Status -->
  <g transform="translate(565, 26)">
    <rect width="155" height="30" rx="8" fill="#0A122C" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4.5" fill="#10B981" filter="url(#neonGlow)" />
    <text x="28" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#34D399" letter-spacing="0.5">LIVE SENTRY 24x7</text>
  </g>

  <!-- 8. Center Title & Status Messaging -->
  <text x="400" y="292" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">GUJARAT POLICE SURVEILLANCE GRID</text>
  <text x="400" y="312" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">AI OPTICAL SENTRY &amp; ANPR INTELLIGENCE</text>
  <text x="400" y="330" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">Awaiting Live RTSP / WebRTC Stream Feed...</text>

  <!-- 9. Bottom Telemetry Cards -->
  <!-- Bottom Left: High-Precision GPS Coordinates -->
  <g transform="translate(80, 394)">
    <rect width="210" height="28" rx="6" fill="#0A122C" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FEF08A">📍 23°01'21" N | 72°35'14" E</text>
  </g>

  <!-- Bottom Center: Optical OCR Engine -->
  <g transform="translate(305, 394)">
    <rect width="190" height="28" rx="6" fill="#0A122C" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
    <text x="95" y="18" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#34D399" text-anchor="middle">⚡ OPTICAL OCR READY</text>
  </g>

  <!-- Bottom Right: Secure Protocol -->
  <g transform="translate(510, 394)">
    <rect width="210" height="28" rx="6" fill="#0A122C" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38BDF8">🔒 AES-256 SECURE FEED</text>
  </g>

  <!-- 10. Foreground Scanline Texture -->
  <rect width="800" height="450" fill="url(#scanlines)" pointer-events="none" />
</svg>
